services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      SERVICE_MODE: "${SERVICE_MODE:-normal}"
      SERVICE_VERSION: "${SERVICE_VERSION:-1.4.2}"
      TARGET_SERVICE_URL: "${TARGET_SERVICE_URL:-http://127.0.0.1:3001}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      API_URL: "${API_URL:-http://localhost:3001}"
    depends_on:
      - backend
